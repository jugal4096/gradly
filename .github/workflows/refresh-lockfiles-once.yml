name: One-time Gradly lockfile refresh

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - fix/production-readiness-2026-10-28

permissions:
  contents: write

jobs:
  refresh:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfiles without lifecycle scripts
        shell: bash
        run: |
          set -e
          for project in gradly-v2/backend gradly-v2 gradly-ecosystem; do
            (
              cd "$project"
              npm install --package-lock-only --ignore-scripts --no-audit --no-fund
              npm audit fix --package-lock-only --ignore-scripts --no-fund || true
            )
          done
      - name: Commit refreshed lockfiles and remove this one-time workflow
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradly-v2/backend/package-lock.json gradly-v2/package-lock.json gradly-ecosystem/package-lock.json
          git rm .github/workflows/refresh-lockfiles-once.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): refresh lockfiles within declared ranges"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
