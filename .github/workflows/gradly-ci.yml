name: Gradly CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradly-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: ${{ matrix.app }} — lint and production build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Gradly Ecosystem
            directory: gradly-ecosystem
          - app: Gradly Student App
            directory: gradly-v2
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build

  backend-tests:
    name: Gradly Backend — guest security tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gradly-v2/backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gradly-v2/backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run backend regression tests
        run: npm test
